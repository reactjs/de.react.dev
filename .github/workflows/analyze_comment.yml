name: Analyze Bundle (Comment)

on:
  workflow_run:
    workflows: ['Analyze Bundle']
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write
  
jobs:
  comment:
    runs-on: ubuntu-latest
    if: >
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download base branch bundle stats
        uses: dawidd6/action-download-artifact@ac66b43f0e6a346234dd65d4d0c8fbb31cb316e5 # v11
        with:
          workflow: analyze.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: analysis_comment.txt
          path: analysis_comment.txt
          if_no_artifact_found: warn

      - name: Download PR number
        uses: dawidd6/action-download-artifact@ac66b43f0e6a346234dd65d4d0c8fbb31cb316e5 # v11
        with:
          workflow: analyze.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: pr_number
          path: pr_number
          if_no_artifact_found: warn

      - name: Check comment artifact exists
        id: comment-artifact
        run: |
          if [ -f analysis_comment.txt/__bundle_analysis_comment.txt ] && [ -f pr_number/pr_number ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No bundle analysis comment artifact (comparison was skipped); nothing to post."
          fi

      - name: Get comment body
        id: get-comment-body
        if: success() && steps.comment-artifact.outputs.exists == 'true'
        run: |
          echo 'body<<EOF' >> $GITHUB_OUTPUT
          echo '' >>  $GITHUB_OUTPUT
          echo '## Size changes' >>  $GITHUB_OUTPUT
          echo '' >>  $GITHUB_OUTPUT
          echo '<details>' >>  $GITHUB_OUTPUT
          echo '' >>  $GITHUB_OUTPUT
          cat analysis_comment.txt/__bundle_analysis_comment.txt >> $GITHUB_OUTPUT
          echo '' >>  $GITHUB_OUTPUT
          echo '</details>' >>  $GITHUB_OUTPUT
          echo '' >>  $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          pr_number=$(cat pr_number/pr_number)
          echo "pr-number=$pr_number" >> $GITHUB_OUTPUT

      - name: Comment
        if: success() && steps.comment-artifact.outputs.exists == 'true'
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728
        with:
          header: next-bundle-analysis
          number: ${{ steps.get-comment-body.outputs.pr-number }}
          message: ${{ steps.get-comment-body.outputs.body }}
